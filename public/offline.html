<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CampusKit — Offline Mode</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafaf9;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0c0a09;
          color: #f5f5f4;
        }
        .card {
          background: #1c1917;
          border-color: #292524;
        }
      }
      .card {
        max-width: 400px;
        width: 100%;
        padding: 28px 24px;
        border-radius: 20px;
        background: #ffffff;
        border: 1px solid #e7e5e4;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.5;
        margin: 0 0 20px;
        opacity: 0.8;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 12px;
        background: #4f46e5;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>CampusKit is Offline</h1>
      <p>The initial app bundle has not finished caching yet, or this page is unavailable offline. Reconnect briefly once to cache CampusKit for complete offline use.</p>
      <a href="/">Reload CampusKit</a>
    </main>
  </body>
</html>
